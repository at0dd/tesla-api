name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore TeslaAPI.sln

    - name: Build
      run: dotnet build --no-restore TeslaAPI.sln

    - name: Test
      run: dotnet test --solution TeslaAPI.sln --no-build
