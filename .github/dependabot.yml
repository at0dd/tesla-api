# Dependabot version updates: one PR a month for every ecosystem.
# Options: https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference
# One PR: https://docs.github.com/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates
#
# Each entry must set `patterns` and `multi-ecosystem-group`. The schedule
# and assignees live on the group.

version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    assignees:
      - "at0dd"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 7

  - package-ecosystem: "nuget"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 14
      semver-patch-days: 7
